<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>France Transparence</title><link rel="stylesheet" href="css/app.css?v=20261009h"></head>
<body><div class="stick"><div class="banner"><div class="wrap"><strong>Corpus</strong><span id="banner-count">fiches</span></div></div><header class="site"><div class="wrap"><div class="brand"><h1><a href="index.html">France Transparence.app</a></h1><p class="tag">Un vote dans la machine, recollé au tract.</p></div><nav class="site"><a href="index.html" aria-current="page">Fiches</a><a href="methode.html">Méthode</a><a href="sources.html">Sources</a><a href="reponse.html">Droit de réponse</a></nav></div></header></div>
<main><div class="wrap"><h1 class="page">Promesse datée, scrutin public.</h1><p class="lede">Chaque fiche pose un élu, un extrait de programme, un vote, et un statut : aligné, opposé ou incomparable.</p><div class="search"><label for="q">Recherche</label><input id="q" type="search" placeholder="ex. Retailleau, Brossat, Ripost"><label for="dep" style="margin-top:12px">Ou un département</label><select id="dep" style="width:100%;font:inherit;font-size:18px;padding:10px 12px;border:1px solid #d4cebf;background:#fff"><option value="">Tous les départements</option></select></div><div class="filters" id="filters"></div><div class="grid" id="liste"></div><div id="elus-box"></div></div></main>
<script src="js/app.js?v=20261009h"></script>
<script>
const THEMES=["Tous","Social","Santé","Climat","Énergie","Budget","Immigration","Sécurité","Europe","Agriculture","Institutions"];
let DATA=null, theme="Tous";
function render(){const q=FT.normalize(document.getElementById("q").value); const dep=document.getElementById("dep").value; const rows=DATA.fiches.filter(f=>{const elu=FT.eluById(DATA.elus,f.eluId); if(theme!=="Tous"&&f.theme!==theme) return false; if(dep&&elu&&elu.departement!==dep) return false; return FT.matchQuery(q,f,elu);}); document.getElementById("liste").innerHTML=rows.length?rows.map(f=>FT.cardHTML(f,FT.eluById(DATA.elus,f.eluId))).join(""):((q||dep)?"<p class='empty'>Pas encore de fiche rédigée.</p>":""); const ebox=document.getElementById("elus-box"); if(q.length>=2||dep){const countBy={}; DATA.fiches.forEach(f=>countBy[f.eluId]=(countBy[f.eluId]||0)+1); let elus=DATA.elus.filter(e=>(!dep||e.departement===dep)&&(!q||FT.matchElu(q,e))); elus.sort((a,b)=>(a.circoNum||0)-(b.circoNum||0)||a.nom.localeCompare(b.nom,"fr")); ebox.innerHTML="<h2 class='block' style='margin-top:28px'>Circonscriptions · "+elus.length+"</h2><div class='grid'>"+elus.slice(0,80).map(e=>FT.eluCardHTML(e,countBy[e.id]||0)).join("")+"</div>";} else ebox.innerHTML="";}
function renderFilters(){const el=document.getElementById("filters"); el.innerHTML=THEMES.map(t=>`<button type="button" data-theme="${t}" aria-pressed="${t===theme}">${t}</button>`).join(""); el.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{theme=b.dataset.theme; renderFilters(); render();}));}
function fillDeps(){const sel=document.getElementById("dep"); const deps=[...new Set(DATA.elus.map(e=>e.departement).filter(d=>d&&d!=="France"))].sort((a,b)=>a.localeCompare(b,"fr")); sel.innerHTML="<option value=''>Tous les départements</option>"+deps.map(d=>`<option value="${d}">${d}</option>`).join("");}
FT.loadData().then(d=>{DATA=d; document.getElementById("banner-count").textContent=d.meta.nbFiches+" fiches · ceci n’est pas un score"; fillDeps(); renderFilters(); render();}).catch(()=>{document.getElementById("liste").innerHTML="<p class='empty'>Chargement impossible.</p>";});
document.getElementById("q").addEventListener("input",render); document.getElementById("dep").addEventListener("change",render);
</script></body></html>
