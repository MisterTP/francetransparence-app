<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Fiche</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=Source+Sans+3:wght@400;600;700&display=swap"><link rel="stylesheet" href="css/app.css?v=20261009c"></head>
<body><div class="stick"><div class="banner"><div class="wrap"><strong>Corpus</strong><span>Une fiche n’est pas un bulletin de notes.</span></div></div><header class="site"><div class="wrap"><div class="brand"><h1><a href="index.html">France Transparence.app</a></h1><p class="tag">Un vote dans la machine, recollé au tract.</p></div><nav class="site"><a href="index.html">Fiches</a><a href="methode.html">Méthode</a><a href="sources.html">Sources</a><a href="reponse.html">Droit de réponse</a></nav></div></header></div>
<main><div class="wrap" id="root"><p class="empty">Chargement…</p></div></main>
<footer class="site"><div class="wrap"><a href="index.html">← Toutes les fiches</a></div></footer>
<script src="js/app.js?v=20261009c"></script>
<script>
const id=new URLSearchParams(location.search).get("id");
FT.loadData().then(({fiches,elus})=>{
  const fiche=fiches.find(f=>f.id===id); const root=document.getElementById("root");
  if(!fiche){root.innerHTML="<p class='empty'>Fiche introuvable.</p>"; return;}
  const elu=FT.eluById(elus,fiche.eluId)||{id:fiche.eluId,nom:fiche.eluId,circonscription:"",groupe:""};
  document.title=fiche.scrutin.intitule+" — France Transparence.app";
  root.innerHTML=`<article class="fiche"><header><p class="small">${fiche.chambre} · ${fiche.theme} · ${FT.fmtDate(fiche.scrutin.date)}</p><h1 class="page">${fiche.scrutin.intitule}</h1><p class="lede"><a href="elu.html?id=${elu.id}">${elu.nom}</a> · ${elu.circonscription} · ${elu.groupe} · vote <strong>${FT.voteLabel(fiche.voteElu)}</strong> · <span class="statut ${fiche.statut}">${FT.statutLabel(fiche.statut)}</span></p></header><div class="block"><h2>Ce que le texte fait</h2><p>${fiche.ceQueLeTexteFait}</p><p class="small">${fiche.scrutin.type} · résultat : ${fiche.scrutin.resultat}</p></div><div class="cols"><div class="block"><h2>Vote</h2><p>Vote <strong>${FT.voteLabel(fiche.voteElu)}</strong>.</p><p class="small"><a href="${fiche.scrutin.lienOfficiel}">Dossier</a> · <a href="${fiche.scrutin.lienDatan}">vote nominatif</a></p></div><div class="block"><h2>Extrait</h2><blockquote>${fiche.extraitPromesse.texte}</blockquote><p class="small">${fiche.extraitPromesse.source} · <a href="${fiche.extraitPromesse.url}">source</a></p></div></div><div class="block"><h2>Statut</h2><p><span class="statut ${fiche.statut}">${FT.statutLabel(fiche.statut)}</span></p></div><div class="block limite"><h2>Limite</h2><p>${fiche.limite}</p></div><div class="block"><h2>Droit de réponse</h2><p>${fiche.droitReponse||"Aucun texte reçu. Écrire à côté, pas à la place."}</p></div></article>`;
});
</script></body></html>
